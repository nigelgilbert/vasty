[project]
name = "vasty"
version = "0.1.0"
description = "Leased GPU compute for agents on Vast.ai"
requires-python = ">=3.11"
dependencies = ["vastai==1.9.1"]

[project.scripts]
vasty = "vasty.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/vasty"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["vastai", "vastai.*"]
ignore_missing_imports = true
